name: Android CI (Precompiled SO Build)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch: # Allows you to trigger actions manually from the GitHub page

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # 💡 Key point: Use the `-x` flag to force the skipping of the original author's Rust compilation task
      # Gradle is smart enough to automatically pick up the pre-built .so libraries you’ve placed in the `jniLibs` directory and include them in the final package
      - name: Run Unit Tests
        run: ./gradlew --no-daemon testDebugUnitTest -x buildRustLibs

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug -x buildRustLibs

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: TS6-Han-Android-App
          path: app/build/outputs/apk/debug/app-debug.apk