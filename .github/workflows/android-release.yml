name: Android Release (Signed APK → GitHub Release)

# Pushing a tag in the format `v*.*.*-Han` automatically triggers the build of a production-signed package and the creation of a Release.
# The "Check for Updates" feature within the app retrieves the latest official release published here:
#   - The release must be an official release (not a draft or a pre-release)
#   - There is exactly one .apk file among the assets (UpdateChecker selects the first asset that ends with .apk)
on:
  push:
    tags:
      - 'v*.*.*-Han'
  # Allow manual rerun: Simply select a tag as the ref on the Actions page to trigger the action.
  # GITHUB_REF_NAME remains the tag name, and the resulting artifacts are identical to those from the original tag push.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Prevent forgetting to update the version number: the tag must match the `versionName` in `build.gradle.kts`;
      # otherwise, the in-app update check will incorrectly identify the version
      - name: Preflight — tag must match versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG_VERSION versionName=$DECLARED"
          if [ "$TAG_VERSION" != "$DECLARED" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) does not match versionName ($DECLARED). Bump the version in app/build.gradle.kts and tag that commit."
            exit 1
          fi

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon testDebugUnitTest -x buildRustLibs

      - name: Decode signing keystore
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease -x buildRustLibs
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: Rename APK and compute SHA-256
        run: |
          # Asset naming follows the existing convention for this repository (previously TS6_Droid_Han-2.1.5.apk):
          # Remove the 'v' prefix and '-Han' suffix from the tag to produce TS6_Droid_Han-<version>.apk
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-Han}"
          NAME="TS6_Droid_Han-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pick release notes
        id: notes
        run: |
          # Each tag can include a handwritten set of release notes: release-notes/<tag>.md
          # If none is provided, the generic body text below will be used; the release process will not fail due to a missing file.
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES"
          else
            echo "No $NOTES; falling back to the generic body"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TS6 Droid Han v${{ env.VERSION }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          # When `body_path` is empty, `action` defaults back to `body`
          body_path: ${{ steps.notes.outputs.path }}
          body: |
            TS6 Droid Persian Edition ${{ github.ref_name }}

            - Officially signed installation package: `${{ env.ASSET }}` (can be used for direct, in-place updates)
            - For the SHA-256 checksum, please refer to the corresponding `.sha256` file
            - For key updates in this release, see the [README changelog](https://github.com/${{ github.repository }}/blob/main/README.md#Changelog)
            - Full source code for this tag (GPLv3)
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
